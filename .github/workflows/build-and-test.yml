name : Build and test

on : [push , pull_request]

jobs:
    build-and-test:
        strategy:
            matrix:
                os : [ubuntu-latest , windows-latest]
        runs-on : ubuntu-latest #could be matrix
        steps:
            - uses: actions/checkout@v4

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with: 
                    version: '6.4.2'
                    host: linux
                    target: desktop
                    arch: gcc_64
                    modules: 'qtserialport qtserialbus'

            - name: Configure
              run: cmake --preset debug 

            - name: Build
              run: cmake --build --preset debug 

            #- name: Run unit tests
            #  run: ctest --preset debug --output-on-failure -L unit

            - name: Run integration tests
              run: ctest --preset debug --output-on-failure -L integration --verbose

    sanitize:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jurplel/install-qt-action@v4
            - name: Configure and build with sanitize
              run: |
                cmake --preset sanitize
                cmake --build --preset sanitize

            - name: run tests under sanitizer
              run: ctest --preset sanitize --output-on-failure --verbose

    coverage:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: jurplel/install-qt-action@v4
        - name: BUild with coverage instrumentation
          run: |
            cmake --preset debug --DCMAKE_CXX_FLAGS="--coverage"
            cmake --build --preset debug
        - name: Run tests
          run: ctest --preset debug --verbose
        - name: Generate coverage report
          run: |
            lcov --capture --directory . --output-file coverage.info
            lcov --extract coverage.info '*/src/*' '*/utils/*' --output-file coverage-filtered.info
            lcov --list coverage-filtered.info


